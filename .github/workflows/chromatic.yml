name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress Chromatic runs when a new commit lands.
concurrency:
  group: chromatic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Storybook to Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Chromatic needs full git history for accurate baselines.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Don't fail the build on visual changes — review them in Chromatic UI.
          exitZeroOnChanges: true
          # Skip rebuild if no story files changed.
          onlyChanged: true